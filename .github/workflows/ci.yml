# Builds and tests the shared core on every target platform.
# A green run moves a platform to "core-compiles" in docs/ROADMAP.md. It does NOT mean the
# platform app is supported; that requires a native shell and real-device testing.
name: core

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (GCC + sanitizers, Clang -Werror)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GCC with ASan/UBSan
        run: |
          cmake -S . -B build-gcc -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-gcc -j
          ctest --test-dir build-gcc --output-on-failure
      - name: Clang -Werror
        run: |
          CXX=clang++ cmake -S . -B build-clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Werror -Wall -Wextra"
          cmake --build build-clang -j
          ctest --test-dir build-clang --output-on-failure

  macos:
    name: macOS (core build + tests)
    runs-on: macos-15  # macos-14 was retired by GitHub on 2026-11-02
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC core build + tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release -j
          ctest --test-dir build -C Release --output-on-failure

  ios:
    name: iOS (core cross-compile, arm64)
    runs-on: macos-15  # macos-14 was retired by GitHub on 2026-11-02
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ios --target ynot_core -j

  android:
    name: Android (core cross-compile, arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build-android \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target ynot_core -j

  # ---------------------------------------------------------------- JUCE app (M1)
  app-linux:
    timeout-minutes: 45
    name: App (Linux dev host, JUCE) + smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev xvfb
      - run: |
          cmake -S . -B build -DYNOT_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          xvfb-run -a build/app/YnotApp_artefacts/Release/Ynot --smoke-test "$RUNNER_TEMP/smoke.ynot"

  app-macos:
    timeout-minutes: 45
    name: App (macOS, CoreAudio + AU/VST3 hosting)
    runs-on: macos-15  # macos-14 was retired by GitHub on 2026-11-02
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Apple Silicon only here: a universal app build takes ~37 min per push. The core job
          # still builds and tests universal (arm64 + x86_64); Intel app builds are a release step.
          cmake -S . -B build -DYNOT_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          build/app/YnotApp_artefacts/Release/Ynot.app/Contents/MacOS/Ynot --smoke-test "$RUNNER_TEMP/smoke.ynot"
          # Downloadable build (unsigned, not notarized: see docs/DOWNLOADS.md).
          ditto -c -k --keepParent build/app/YnotApp_artefacts/Release/Ynot.app Ynot-macOS-AppleSilicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ynot-macOS-AppleSilicon
          path: Ynot-macOS-AppleSilicon.zip
          retention-days: 30

  app-windows:
    timeout-minutes: 45
    name: App (Windows, WASAPI + VST3 hosting)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          cmake -S . -B build -A x64 -DYNOT_BUILD_APP=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release -j
          ctest --test-dir build -C Release --output-on-failure
          build/app/YnotApp_artefacts/Release/Ynot.exe --smoke-test "$RUNNER_TEMP/smoke.ynot"
          mkdir -p dist && cp build/app/YnotApp_artefacts/Release/Ynot.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Ynot-Windows-x64
          path: dist/Ynot.exe
          retention-days: 30

  app-ios:
    timeout-minutes: 45
    name: App (iOS simulator build, unsigned)
    runs-on: macos-15  # macos-14 was retired by GitHub on 2026-11-02
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build-ios -G Xcode -DYNOT_BUILD_APP=ON -DYNOT_BUILD_TESTS=OFF \
                -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          cmake --build build-ios --target YnotApp --config Debug -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
